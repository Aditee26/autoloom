server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Webhook payloads are capped at 256kb by the API; keep the proxy limit just above it.
  client_max_body_size 2m;

  # API + webhooks are proxied to the Express container (same origin => no CORS needed).
  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Workflow runs execute synchronously inside the request (HTTP nodes can take a while).
    proxy_read_timeout 150s;
  }

  # Single-page app: unknown paths fall back to index.html (React Router).
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
